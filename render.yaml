services:
  - type: web
    name: customize-ecommerce
    runtime: python
    plan: free
    region: oregon
    branch: master
    rootDir: ec
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput --clear && python manage.py migrate
    startCommand: gunicorn ec.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key:  DJANGO_DEBUG
        value: False
      - key: DJANGO_ALLOWED_HOSTS
        value: . onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value:  https://. onrender.com
